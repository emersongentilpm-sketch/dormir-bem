<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DormirBem - Sons para Bebês</title>
    <meta name="theme-color" content="#7c3aed">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white; min-height: 100vh; padding: 20px; text-align: center;
        }
       .container { max-width: 400px; margin: 0 auto; padding-top: 40px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { opacity: 0.9; margin-bottom: 40px; }
       .sound-btn {
            display: block; width: 100%; padding: 20px; margin: 15px 0;
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 15px; color: white; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; backdrop-filter: blur(10px);
        }
       .sound-btn:active { transform: scale(0.98); }
       .playing { background: rgba(34, 197, 94, 0.3); border-color: #22c55e; }
       .stop-btn { 
            background: #ef4444; margin-top: 30px; border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 DormirBem</h1>
        <p>Sons relaxantes para o seu bebê dormir</p>
        
        <button class="sound-btn" onclick="playSound('rain')">🌧️ Chuva Relaxante</button>
        <button class="sound-btn" onclick="playSound('white')">📻 Ruído Branco</button>
        <button class="sound-btn" onclick="playSound('fan')">🌀 Ventilador</button>
        <button class="sound-btn stop-btn" onclick="stopAll()">⏹️ Parar Tudo</button>
    </div>

    <script>
        let audioContext;
        let currentOscillators = [];
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function stopAll() {
            currentOscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            currentOscillators = [];
            document.querySelectorAll('.sound-btn').forEach(btn => btn.classList.remove('playing'));
        }
        
        function playSound(type) {
            initAudio();
            stopAll();
            event.target.classList.add('playing');
            
            if (type === 'rain') {
                createRainSound();
            } else if (type === 'white') {
                createWhiteNoise();
            } else if (type === 'fan') {
                createFanSound();
            }
        }
        
        function createRainSound() {
            for (let i = 0; i < 3; i++) {
                const bufferSize = 4096;
                const noise = audioContext.createScriptProcessor(bufferSize, 1, 1);
                noise.onaudioprocess = e => {
                    const output = e.outputBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                };
                const filter = audioContext.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 800 + i * 200;
                noise.connect(filter);
                filter.connect(audioContext.destination);
                currentOscillators.push(noise);
            }
        }
        
        function createWhiteNoise() {
            const bufferSize = 4096;
            const noise = audioContext.createScriptProcessor(bufferSize, 1, 1);
            noise.onaudioprocess = e => {
                const output = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
            };
            const gain = audioContext.createGain();
            gain.gain.value = 0.1;
            noise.connect(gain);
            gain.connect(audioContext.destination);
            currentOscillators.push(noise);
        }
        
        function createFanSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sawtooth';
            osc.frequency.value = 80;
            gain.gain.value = 0.05;
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            currentOscillators.push(osc);
        }
        
        document.body.addEventListener('click', initAudio, { once: true });
    </script>
</body>
</html>
